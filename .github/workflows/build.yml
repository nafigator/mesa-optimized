name: Build Mesa with optimizations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (leave empty to auto-generate)'
        required: false
        default: ''
  push:
    tags:
      - "v*.*.*"

env:
  MESA_VERSION: '25.0.7'
  PACKAGE_VERSION: '25.0.7-2+deb13u1'
  OPT_FLAGS: '-march=x86-64-v4 -mtune=znver4 -O3 -fno-plt -fomit-frame-pointer -falign-functions=32 -falign-loops=32 -falign-jumps=32'

jobs:
  build-deb:
    runs-on: self-hosted
    container:
      image: devuan/devuan:excalibur
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${MESA_VERSION}-$(date -u +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb     http://mirror.yandex.ru/mirrors/devuan/merged excalibur main" > /etc/apt/sources.list
          echo "deb-src http://mirror.yandex.ru/mirrors/devuan/merged excalibur main" >> /etc/apt/sources.list
          echo "deb     http://mirror.yandex.ru/mirrors/devuan/merged excalibur-updates main" >> /etc/apt/sources.list
          echo "deb-src http://mirror.yandex.ru/mirrors/devuan/merged excalibur-updates main" >> /etc/apt/sources.list
          apt update
          apt install -y --no-install-recommends \
            build-essential devscripts equivs ca-certificates zstd

      - name: Download Mesa source
        run: |
          apt update
          apt source mesa-vulkan-drivers=${{ env.PACKAGE_VERSION }}

      - name: Install build dependencies from control file
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Patch debian/rules with optimization flags
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          sed -i '/^override_dh_auto_configure:/i confflags += -Dc_args="${{ env.OPT_FLAGS }}" -Dcpp_args="${{ env.OPT_FLAGS }}"' debian/rules
          grep -B 1 '^override_dh_auto_configure:' debian/rules

      - name: Build .deb packages
        run: |
          mkdir -p packages
          mkdir -p dev-packages
          cd mesa-${{ env.MESA_VERSION }}
          dh_clean
          rm -rf build obj-*
          # noautodbgsym — don't make dbgsym-packages
          # noddebs — don't make .ddeb
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs"
          dpkg-buildpackage -b -us -uc
          # copy packages
          find .. -maxdepth 1 \
            -name '*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            ! -name '*-dev_*' \
            -exec mv {} ../packages/ \;
          # copy dev-packages
          find .. -maxdepth 1 \
            -name '*-dev_*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            -exec mv {} ../dev-packages/ \;

      - name: Verify no dbgsym packages
        run: |
          if ls packages/*dbgsym* packages/*ddeb* dev-packages/*dbgsym* dev-packages/*ddeb* 2>/dev/null; then
            echo "ERROR: dbgsym/ddeb packages found!"
            exit 1
          fi
          echo "OK: no dbgsym packages"
          ls -lh packages/
          ls -lh dev-packages/

      - name: Make archives
        run: |
          tar -caf "mesa-${GITHUB_REF_NAME}.tar.zst" "packages"
          tar -caf "mesa-${GITHUB_REF_NAME}-dev.tar.zst" "dev-packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesa-deb-packages
          path: ./*.zst
          retention-days: 5

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mesa-deb-packages
          path: .

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-deb.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              ./*.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mesa ${MESA_VERSION} (${TAG})" \
              --generate-notes \
              --draft
              ./*.zst
          fi
