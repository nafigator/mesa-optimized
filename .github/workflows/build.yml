name: Build Mesa with optimizations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (leave empty to auto-generate)'
        required: false
        default: ''
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  MESA_VERSION: '25.0.7'
  PACKAGE_VERSION: '25.0.7-2+deb13u1'
  OPT_FLAGS: '-march=x86-64-v4 -mtune=znver4 -O3 -fno-plt -fomit-frame-pointer -falign-functions=32 -falign-loops=32 -falign-jumps=32'

jobs:
  build-deb:
    runs-on: self-hosted
    container:
      image: devuan/devuan:excalibur
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${MESA_VERSION}-$(date -u +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb     http://mirror.yandex.ru/mirrors/devuan/merged excalibur main" > /etc/apt/sources.list
          echo "deb-src http://mirror.yandex.ru/mirrors/devuan/merged excalibur main" >> /etc/apt/sources.list
          echo "deb     http://mirror.yandex.ru/mirrors/devuan/merged excalibur-updates main" >> /etc/apt/sources.list
          echo "deb-src http://mirror.yandex.ru/mirrors/devuan/merged excalibur-updates main" >> /etc/apt/sources.list
          apt update
          apt install -y --no-install-recommends \
            build-essential devscripts equivs ca-certificates

      - name: Download Mesa source
        run: |
          apt update
          apt source mesa-vulkan-drivers=${{ env.PACKAGE_VERSION }}

      - name: Install build dependencies from control file
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Patch debian/rules with optimization flags
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          sed -i '/^override_dh_auto_configure:/i confflags += -Dc_args="${{ env.OPT_FLAGS }}" -Dcpp_args="${{ env.OPT_FLAGS }}"' debian/rules
          grep -B 1 '^override_dh_auto_configure:' debian/rules

      - name: Clean old artifacts
        run: |
          rm -rf packages
          rm -f ../*.deb ../*.buildinfo ../*.changes
          mkdir -p packages

      - name: Build .deb packages
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          dh_clean
          rm -rf build obj-*
          # noautodbgsym — don't make dbgsym-packages
          # noddebs — don't make .ddeb
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs"
          dpkg-buildpackage -b -us -uc
          find .. -maxdepth 1 -name '*.deb' \
            ! -name '*dbgsym*' ! -name '*ddeb*' \
            -exec mv {} ../packages/ \;

      - name: Verify no dbgsym packages
        run: |
          cd mesa-${{ env.MESA_VERSION }}
          if ls ../packages/*dbgsym* ../packages/*ddeb* 2>/dev/null; then
            echo "ERROR: dbgsym/ddeb packages found!"
            exit 1
          fi
          echo "OK: no dbgsym packages"
          ls -lh ../packages/

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-deb-packages
          path: packages/*.deb
          retention-days: 5

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mesa-deb-packages
          path: packages

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-deb.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mesa ${MESA_VERSION} (${TAG})" \
            --generate-notes \
            --latest \
            packages/*.deb
